name: Screenote plugin

on:
  push:
    branches: [main]
    paths:
      - "plugins/screenote/**"
      - "plugins/agent-writing/agents/journalist.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - ".github/workflows/screenote.yml"
  pull_request:
    paths:
      - "plugins/screenote/**"
      - "plugins/agent-writing/agents/journalist.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "README.md"
      - ".github/workflows/screenote.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate marketplace and plugin JSON
        run: >-
          jq empty
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json
          plugins/screenote/.claude-plugin/marketplace.json
          plugins/screenote/.claude-plugin/plugin.json
          plugins/screenote/.codex-plugin/plugin.json
      - name: Validate plugin schemas and skill frontmatter
        run: python3 plugins/screenote/evals/validate-plugin.py
      - name: Validate Screenote CLI skill contract
        run: bash plugins/screenote/evals/lint-skills.sh
      - name: Verify CLI contract drift fails lint
        run: bash plugins/screenote/evals/lint-skills-test.sh
      - name: Validate CLI launcher and shell scripts
        run: |
          bash -n plugins/screenote/evals/lint-skills.sh
          bash -n plugins/screenote/evals/lint-skills-test.sh
          bash -n plugins/screenote/scripts/screenote-cli.sh
      - name: Exercise Screenote CLI contract tests
        run: python3 -m unittest tests.test_screenote_cli_contract -v
